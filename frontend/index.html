<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dataferry</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              canvas: "#050505",
              surface: "#171717",
              "surface-border": "#424242",
              "surface-muted": "#525252",
              brand: "#2bd766",
              ink: "#0e0e0e",
            },
            fontFamily: {
              sans: ["Noto Sans", "sans-serif"],
              mono: ["ui-monospace", "SFMono-Regular", "Menlo", "monospace"],
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="/styles.css" />
    <!-- Populated at container start (see docker-entrypoint.sh) so the API
         base URL is configurable without rebuilding the static bundle. -->
    <script src="/env.js"></script>
  </head>
  <body class="bg-canvas text-white font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
